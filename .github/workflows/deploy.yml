
name: Build and Deploy Employee Demo

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout source code on EC2
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: mvn -B clean package

      # 4. Deploy application using Docker
      - name: Deploy Docker container
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -eu

          docker pull eclipse-temurin:21-jre

          docker rm -f employee-demo 2>/dev/null || true

          docker run -d \
            --name employee-demo \
            --restart unless-stopped \
            -p 8080:8080 \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -v "$GITHUB_WORKSPACE/target/employee-demo-0.0.1-SNAPSHOT.jar:/app/app.jar:ro" \
            eclipse-temurin:21-jre \
            java -jar /app/app.jar

      # 5. Check container status
      - name: Verify deployment
        run: docker ps --filter name=employee-demo
